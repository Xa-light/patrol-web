# ============================================================
#  前端站点配置：静态资源 + 反向代理
#  容器内 nginx 同时承担「静态托管」与「API 网关」两个角色，
#  浏览器只访问一个地址（http://<主机>/），不再跨域。
# ============================================================

upstream patrol_api {
    # docker-compose 中的服务名
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;      # 车端抓拍上传上限
    server_tokens off;

    # ---------------- 压缩 ----------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---------------- 健康检查（给容器探针用） ----------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------- 反向代理 ----------------
    location /api/ {
        proxy_pass http://patrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 抓拍原图（由后端 FileResponse 提供）
    location /uploads/ {
        proxy_pass http://patrol_api;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SLAM 地图等静态资源
    location /static/ {
        proxy_pass http://patrol_api;
        proxy_set_header Host $host;
        expires 1d;
    }

    # MJPEG 视频流：必须关闭缓冲，否则画面会累积延迟
    location /api/v1/video/stream {
        proxy_pass http://patrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---------------- 静态资源 ----------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------------- SPA 兜底 ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
